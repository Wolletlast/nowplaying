<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NowPlaying</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 420px; height: 150px; background: transparent; overflow: hidden;
    font: 13px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; }

  .card { position: relative; width: 420px; height: 150px; border-radius: 30px; overflow: hidden;
    background: #14161c; -webkit-app-region: drag; transition: opacity .2s; }
  .bg { position: absolute; inset: -40px; background: linear-gradient(135deg, #2c2244, #14161c);
    background-size: cover; background-position: center;
    filter: blur(30px) saturate(1.3) brightness(.62); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.4)); }
  .content { position: absolute; inset: 0; display: flex; align-items: center; gap: 14px; padding: 0 18px 0 17px; }

  /* ---- виниловая пластинка: обложка на весь диск ---- */
  .vinyl { position: relative; flex: none; width: 124px; height: 124px; border-radius: 50%;
    box-shadow: 0 10px 22px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12); }
  .disc { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #0b0b0d;
    animation: spin 5.5s linear infinite; animation-play-state: paused; }
  .vinyl.on .disc { animation-play-state: running; }
  .cover { position: absolute; inset: 0; background: radial-gradient(circle at 40% 35%, #6c4bd6, #2a1d55) center / cover; }
  .grooves { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle at center, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.2) 2px 3px); }
  .vinyl.noart .disc { background: repeating-radial-gradient(circle at center, #0b0b0d 0 2px, #1a1a1f 2px 3px); }
  .vinyl.noart .cover { inset: 28%; border-radius: 50%; }
  .vinyl.noart .grooves { display: none; }
  .sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.22) 30deg, rgba(255,255,255,0) 70deg,
      rgba(255,255,255,0) 180deg, rgba(255,255,255,.22) 210deg, rgba(255,255,255,0) 250deg); }
  .spindle { position: absolute; inset: 42%; border-radius: 50%; background: #15161a;
    box-shadow: 0 0 0 3px rgba(15,15,18,.85), 0 0 0 4px rgba(255,255,255,.2); }
  .spindle::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; background: #d9d9de; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- правая часть ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 18px; }
  .app { font-size: 11px; color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gear { -webkit-app-region: no-drag; background: none; border: 0; color: rgba(255,255,255,.72); cursor: pointer;
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .gear:hover { background: rgba(255,255,255,.14); color: #fff; }
  .gear svg { width: 15px; height: 15px; fill: currentColor; }

  .line { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; white-space: nowrap; }
  .line .t, .line .a { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .line .t { font-size: 15px; font-weight: 700; }
  .line .a { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.78); }
  .line .dot { display: none; }

  .seek { -webkit-app-region: no-drag; height: 14px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .track { position: relative; width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: #fff; }
  .thumb { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 3px rgba(80,110,255,.55); }
  .seek.off { cursor: default; opacity: .55; }
  .seek.off .thumb { display: none; }
  .times { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,.7); margin-top: -2px; font-variant-numeric: tabular-nums; }

  .btns { display: flex; justify-content: center; gap: 12px; margin-top: 1px; }
  .btn { -webkit-app-region: no-drag; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    background: rgba(255,255,255,.16); display: grid; place-items: center; transition: background .15s, transform .1s; }
  .btn:hover { background: rgba(255,255,255,.26); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 17px; height: 17px; fill: currentColor; }
  .btn.main-btn { width: 38px; height: 38px; margin-top: -2px; background: rgba(255,255,255,.24); }
  .btn.main-btn svg { width: 20px; height: 20px; }
  .btn.liked { color: #ff4d6d; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:disabled:hover { background: rgba(255,255,255,.16); }

  .idle .vinyl { opacity: .75; }
  .idle .btns, .idle .seek, .idle .times { opacity: .35; pointer-events: none; }

  .vol { -webkit-app-region: no-drag; display: none; align-items: center; gap: 4px; margin: 0 4px 0 6px; color: rgba(255,255,255,.72); flex: none; }
  .vol svg { width: 15px; height: 15px; fill: currentColor; }
  .vol input { width: 64px; height: 14px; accent-color: #fff; cursor: pointer; }
  .card.phone:hover .vol { display: flex; }
  .gear { opacity: 0; transition: opacity .15s; }
  .card:hover .gear, .gear:focus { opacity: 1; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bg" id="bg"></div>
  <div class="shade"></div>

  <div class="content">
    <div class="vinyl" id="vinyl"><div class="disc"><div class="cover" id="label"></div><div class="grooves"></div></div><div class="sheen"></div><div class="spindle"></div></div>

    <div class="main">
      <div class="top">
        <div class="app" id="app"></div>
        <div class="vol" id="vol" title="Громкость звука телефона на ПК"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><input type="range" id="volume" min="0" max="100" step="1"></div>
        <button class="gear" id="gear" title="Настройки"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.3.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
      </div>

      <div class="line"><span class="t" id="t"></span><span class="dot" id="dot">•</span><span class="a" id="a"></span></div>

      <div>
        <div class="seek" id="seek"><div class="track"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div></div>
        <div class="times"><span id="cur">00:00</span><span id="dur">--:--</span></div>
      </div>

      <div class="btns">
        <button class="btn" id="prev" title="Предыдущий"></button>
        <button class="btn main-btn" id="play" title="Пауза / воспроизведение"></button>
        <button class="btn" id="next" title="Следующий"></button>
        <button class="btn" id="like" title="Нравится"></button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const ICONS = {
  play: 'M8 5v14l11-7z',
  pause: 'M6 5h4v14H6zm8 0h4v14h-4z',
  next: 'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',
  prev: 'M6 6h2v12H6zm3.5 6l8.5 6V6z',
  heart: 'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z',
  heartFill: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
};
const setIcon = (el, name) => { el.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ICONS[name]}"/></svg>`; };

let st = null, cfg = null;
let base = { pos: 0, t: 0 };
let dragging = false, dragPos = 0, artV = -1;

const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-NP': '1' }, body: JSON.stringify(body || {}) }).then((r) => r.json()).catch(() => null);
const cmd = (name, extra) => post('/cmd', { cmd: name, ...extra });

const fmt = (ms) => {
  if (!(ms >= 0)) return '--:--';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
};

const position = () => {
  if (!st) return 0;
  let p = st.playing ? base.pos + (performance.now() - base.t) * (st.speed || 1) : base.pos;
  if (st.duration) p = Math.min(p, st.duration);
  return Math.max(0, p);
};

// ---- отрисовка ----
function renderTrack() {
  const has = !!(st && st.title);
  $('#card').classList.toggle('idle', !has);
  $('#card').classList.toggle('phone', !!(has && st.sourceKind === 'phone'));

  if (has) {
    $('#t').textContent = st.title;
    $('#a').textContent = st.artist;
    $('#dot').style.display = st.artist ? '' : 'none';
    $('#app').textContent = st.label || st.app || '';
  } else {
    $('#t').textContent = (st && st.idleTitle) || 'Ничего не играет';
    $('#a').textContent = '';
    $('#dot').style.display = 'none';
    $('#app').textContent = (st && st.idleSub) || '';
  }
  const ctl = !(has && st.controls === false);

  const v = has ? st.artVer : 0;
  if (v !== artV) {
    artV = v;
    const img = v ? `url(/art?v=${v})` : '';
    $('#bg').style.backgroundImage = img;
    $('#label').style.backgroundImage = img;
    $('#vinyl').classList.toggle('noart', !v);
  }

  setIcon($('#play'), has && st.playing ? 'pause' : 'play');
  setIcon($('#like'), has && st.liked ? 'heartFill' : 'heart');
  $('#like').classList.toggle('liked', has && st.liked);
  $('#like').disabled = !(has && st.canLike);
  ['prev', 'play', 'next'].forEach((id) => { $('#' + id).disabled = !ctl; });
  $('#seek').classList.toggle('off', !(has && ctl && st.canSeek && st.duration));
  $('#vinyl').classList.toggle('on', !!(has && st.playing && cfg && cfg.spin));
  $('#dur').textContent = has ? fmt(st.duration || NaN) : '--:--';
  tick();
}

function tick() {
  const has = !!(st && st.title);
  const p = dragging ? dragPos : (has ? position() : 0);
  const frac = has && st.duration ? Math.min(1, p / st.duration) : 0;
  $('#fill').style.width = frac * 100 + '%';
  $('#thumb').style.left = frac * 100 + '%';
  $('#cur').textContent = fmt(has ? p : 0);
}
setInterval(tick, 200);

function renderConfig() {
  $('#card').style.opacity = cfg.opacity / 100;
  if (!volDrag) $('#volume').value = cfg.volume;
  $('#vinyl').classList.toggle('on', !!(st && st.title && st.playing && cfg.spin));
}

// ---- громкость звука телефона ----
let volDrag = false, volTimer = 0;
$('#volume').addEventListener('pointerdown', () => { volDrag = true; });
window.addEventListener('pointerup', () => { volDrag = false; });
$('#volume').oninput = (e) => {
  clearTimeout(volTimer);
  const v = Number(e.target.value);
  volTimer = setTimeout(() => post('/config', { volume: v }), 40);
};
$('#volume').addEventListener('wheel', (e) => {
  e.preventDefault();
  const v = Math.min(100, Math.max(0, Number(e.target.value) + (e.deltaY < 0 ? 5 : -5)));
  e.target.value = v;
  post('/config', { volume: v });
}, { passive: false });

// ---- события сервера ----
const es = new EventSource('/events');
es.addEventListener('state', (e) => {
  st = JSON.parse(e.data);
  base = { pos: st.position + (st.playing ? st.age * (st.speed || 1) : 0), t: performance.now() };
  renderTrack();
});
es.addEventListener('config', (e) => { cfg = JSON.parse(e.data); renderConfig(); });

// ---- кнопки ----
setIcon($('#prev'), 'prev'); setIcon($('#next'), 'next'); setIcon($('#play'), 'play'); setIcon($('#like'), 'heart');

$('#prev').onclick = () => cmd('prev');
$('#next').onclick = () => cmd('next');
$('#play').onclick = () => {
  cmd('toggle');
  if (st && st.title) { base = { pos: position(), t: performance.now() }; st.playing = !st.playing; renderTrack(); }
};
$('#like').onclick = () => {
  cmd('like');
  if (st && st.title) { st.liked = !st.liked; renderTrack(); }
};

// ---- ползунок ----
const seek = $('#seek');
const posFromEvent = (e) => {
  const r = seek.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (st ? st.duration : 0);
};
seek.addEventListener('pointerdown', (e) => {
  if (!st || !st.canSeek || !st.duration) return;
  dragging = true; seek.setPointerCapture(e.pointerId); dragPos = posFromEvent(e); tick();
});
seek.addEventListener('pointermove', (e) => { if (dragging) { dragPos = posFromEvent(e); tick(); } });
seek.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false;
  const p = posFromEvent(e);
  base = { pos: p, t: performance.now() };
  cmd('seek', { pos: Math.round(p) });
  tick();
});

// ---- настройки открываются в отдельном окне ----
const openSettings = async () => {
  const r = await post('/open-settings');
  if (!r || !r.handled) window.open('/settings', 'np-settings', 'width=560,height=720');
};
window.openSettings = openSettings;
$('#gear').onclick = openSettings;
</script>
</body>
</html>
